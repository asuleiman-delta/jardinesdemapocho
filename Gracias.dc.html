<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..600&amp;family=Lora:ital,wght@0,400..700;1,400..700&amp;display=swap" rel="stylesheet">
<style>
html,body{overflow-x:clip}
body{margin:0;background:#FFFFFF;text-wrap:pretty;-webkit-font-smoothing:antialiased}
a{color:#1E1E1E}a:hover{color:#1E1E1E}
@keyframes gr-pop{0%{transform:scale(0.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes gr-up{0%{transform:translateY(16px);opacity:0}100%{transform:none;opacity:1}}
</style>
</helmet>
<div style="font-family: 'Inter', sans-serif; font-size: 14px; line-height: 20px; color: #1E1E1E; background: #FFFFFF; min-height: 100svh; display: flex; flex-direction: column">

<header style="padding: 8px 8px 0">
<div style="max-width: 1400px; margin: 0 auto; padding: 10px 10px 10px clamp(20px, 2.4vw, 32px); display: flex; align-items: center; justify-content: space-between; gap: 16px; background: rgba(255,255,255,0.7); border: 1px solid #E2E2E2; border-radius: 20px; box-sizing: border-box">
<a href="index.html" aria-label="Volver al inicio" style="display: flex"><img src="assets/logo.png" alt="Jardines de Mapocho" style="height: clamp(36px, 8vw, 44px); width: auto; display: block"></img></a>
<a href="index.html" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid #E2E2E2; color: #1E1E1E; text-decoration: none; transition: background 300ms" style-hover="background: #F1F4F0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg><span>Volver al sitio</span></a>
</div>
</header>

<main style="flex: 1; padding: clamp(24px, 4vh, 48px) 16px 16px; display: flex; align-items: center; justify-content: center">
<div style="width: 100%; max-width: 720px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: clamp(12px, 2vh, 20px)">
{{check}}
<span style="font-size: 14px; color: #2E7D4F">Recibimos tus datos</span>
<h1 style="margin: 0; font-family: 'Lora', Georgia, serif; font-weight: 400; font-size: clamp(30px, 4.4vw, 54px); line-height: 1.15; letter-spacing: -0.02em; text-wrap: balance"><span style="display: block">{{saludo}}</span><span style="display: block; color: #A0A0A0; font-style: italic">te llamamos hoy.</span></h1>
<p style="margin: 0; max-width: 520px; font-size: clamp(16px, 1.6vw, 19px); line-height: 1.6; color: #6B6B6B">{{intro}}</p>


<div style="margin-top: 4px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px">
<a href="https://wa.me/56979401661?text=Hola%2C%20acabo%20de%20dejar%20mis%20datos%20en%20la%20web%20de%20Jardines%20de%20Mapocho" target="_blank" rel="noopener" style="display: inline-flex; align-items: center; gap: 8px; height: 56px; padding: 0 28px; border-radius: 999px; background: #2E7D4F; color: #FFFFFF; text-decoration: none; transition: background 400ms cubic-bezier(0.22,1,0.36,1), transform 400ms cubic-bezier(0.22,1,0.36,1)" style-hover="background: #24663F; transform: scale(1.02); color: #FFFFFF"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"></path></svg><span>¿No quieres esperar? Escríbenos</span></a>
<a href="index.html#departamento" style="display: inline-flex; align-items: center; height: 56px; padding: 0 28px; border-radius: 999px; border: 1px solid #E2E2E2; color: #1E1E1E; text-decoration: none; transition: background 300ms" style-hover="background: #F1F4F0">Ver las plantas</a>
</div>
</div>
</main>

<footer style="padding: 0">
<div style="position: relative; color: #6B6B6B; padding: 0 clamp(24px, 5vw, 72px)">
<img src="assets/web/jardin-footer.png" alt="" aria-hidden="true" style="display: block; width: calc(100% + 2 * clamp(24px, 5vw, 72px)); max-width: none; height: auto; aspect-ratio: 2170 / 460; object-fit: cover; object-position: center bottom; margin: 8px calc(-1 * clamp(24px, 5vw, 72px)) 0; pointer-events: none"></img>
</div>
</footer>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const q = new URLSearchParams(window.location.search);
    const n = (q.get('n') || '').trim();
    const uso = (q.get('uso') || '').toLowerCase();
    const inv = uso.includes('invert');
    return {
      saludo: n ? '¡Gracias, ' + n + '!' : '¡Gracias!',
      intro: inv
        ? 'Katherine, nuestra ejecutiva, te contactará hoy para conversar la rentabilidad, las condiciones de compra y agendar tu visita.'
        : 'Katherine, nuestra ejecutiva, te contactará hoy para resolver tus dudas y agendar tu visita al proyecto.',
      pasos: [
        { n: '01', t: 'Datos recibidos', d: 'Ya tenemos tu contacto y lo que buscas.', numColor: '#2E7D4F' },
        { n: '02', t: 'Te llamamos hoy', d: 'Revisa tu teléfono: te llamaremos desde un número de Santiago.', numColor: '#A0A0A0' },
        { n: '03', t: 'Visitas el proyecto', d: 'Recorres el edificio, los jardines y el departamento.', numColor: '#A0A0A0' }
      ],
      check: React.createElement('div', { 'aria-hidden': true, style: { width: 60, height: 60, borderRadius: '50%', background: '#2E7D4F', color: '#FFFFFF', display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: '0 10px 28px rgba(46,125,79,0.28)', animation: 'gr-pop 700ms cubic-bezier(0.22,1,0.36,1) both' } },
        React.createElement('svg', { width: 30, height: 30, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 1.8, strokeLinecap: 'round', strokeLinejoin: 'round' }, React.createElement('path', { d: 'M20 6 9 17l-5-5' })))
    };
  }
}
</script>
</body>
</html>
